<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">
  <defs>
    <filter id="o" x="-25%" y="-25%" width="150%" height="150%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="2.5" result="e"/>
      <feFlood flood-color="white" result="w"/>
      <feComposite in="w" in2="e" operator="in" result="ol"/>
      <feMerge><feMergeNode in="ol"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#o)">
    <!-- 포스트잇 테이프 -->
    <rect x="22" y="6" width="16" height="6" rx="1.5" fill="#f5e890" opacity="0.85"/>
    <!-- 메모지 -->
    <rect x="10" y="10" width="40" height="42" rx="4" fill="#f5f0e8"/>
    <!-- 선들 -->
    <line x1="16" y1="24" x2="44" y2="24" stroke="#e8ddd0" stroke-width="1.5"/>
    <line x1="16" y1="30" x2="44" y2="30" stroke="#e8ddd0" stroke-width="1.5"/>
    <line x1="16" y1="36" x2="36" y2="36" stroke="#e8ddd0" stroke-width="1.5"/>
    <!-- 텍스트 -->
    <text x="30" y="22" text-anchor="middle" font-size="6" fill="#b09080" font-family="sans-serif" font-weight="700">you</text>
    <text x="30" y="30" text-anchor="middle" font-size="6" fill="#b09080" font-family="sans-serif" font-weight="700">got this</text>
    <!-- 하트 -->
    <path d="M27,40 C27,37.5 30,37.5 30,40 C30,42.5 28.5,44.5 28.5,44.5 C28.5,44.5 27,42.5 27,40Z" fill="#f5a0b8"/>
    <path d="M30,40 C30,37.5 33,37.5 33,40 C33,42.5 31.5,44.5 31.5,44.5 C31.5,44.5 30,42.5 30,40Z" fill="#f5a0b8"/>
    <!-- 작은 꽃 장식 -->
    <circle cx="16" cy="42" r="3" fill="#d4e8c0"/>
    <circle cx="13" cy="42" r="1.8" fill="#a8cc88"/>
    <circle cx="16" cy="39" r="1.8" fill="#a8cc88"/>
    <circle cx="19" cy="42" r="1.8" fill="#a8cc88"/>
    <circle cx="16" cy="45" r="1.8" fill="#a8cc88"/>
    <circle cx="16" cy="42" r="1.2" fill="#f5e878"/>
  </g>
</svg>
