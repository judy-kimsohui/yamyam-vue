<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">
  <defs>
    <filter id="o" x="-25%" y="-25%" width="150%" height="150%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="2.5" result="e"/>
      <feFlood flood-color="white" result="w"/>
      <feComposite in="w" in2="e" operator="in" result="ol"/>
      <feMerge><feMergeNode in="ol"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#o)">
    <!-- 카메라 본체 -->
    <rect x="8" y="20" width="44" height="32" rx="6" fill="#e8d8c8"/>
    <!-- 카메라 상단 뷰파인더 -->
    <rect x="20" y="14" width="16" height="8" rx="3" fill="#d4c4b4"/>
    <!-- 렌즈 외부 -->
    <circle cx="30" cy="36" r="13" fill="#c0b0a0"/>
    <!-- 렌즈 중간 -->
    <circle cx="30" cy="36" r="10" fill="#a09080"/>
    <!-- 렌즈 내부 -->
    <circle cx="30" cy="36" r="7" fill="#707060"/>
    <!-- 렌즈 반사 -->
    <circle cx="26.5" cy="32.5" r="2.5" fill="rgba(255,255,255,0.3)"/>
    <circle cx="33" cy="31" r="1.2" fill="rgba(255,255,255,0.2)"/>
    <!-- 셔터 버튼 -->
    <circle cx="44" cy="20" r="3.5" fill="#d0b8a8"/>
    <circle cx="44" cy="20" r="2" fill="#c0a898"/>
    <!-- 반짝임 장식 -->
    <path d="M50,16 L51,13 L52,16 L55,17 L52,18 L51,21 L50,18 L47,17 Z" fill="#f5d890" opacity="0.9"/>
    <circle cx="14" cy="26" r="2" fill="#f5d890" opacity="0.7"/>
    <!-- 스트랩 고리 -->
    <rect x="8" y="26" width="4" height="6" rx="2" fill="#c0b0a0"/>
    <rect x="48" y="26" width="4" height="6" rx="2" fill="#c0b0a0"/>
  </g>
</svg>
