<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">
  <defs>
    <filter id="o" x="-25%" y="-25%" width="150%" height="150%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="2.5" result="e"/>
      <feFlood flood-color="white" result="w"/>
      <feComposite in="w" in2="e" operator="in" result="ol"/>
      <feMerge><feMergeNode in="ol"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#o)">
    <!-- 김 -->
    <path d="M22,10 C22,8 24,7 24,5 C24,7 26,8 26,10 C26,8 28,7 28,5 C28,7 30,8 30,10" fill="none" stroke="#d4b090" stroke-width="1.5" stroke-linecap="round"/>
    <!-- 컵 몸체 -->
    <path d="M14,22 L16,52 Q16,56 20,56 L40,56 Q44,56 44,52 L46,22 Z" fill="#fdf0e0"/>
    <!-- 컵 내용물 -->
    <path d="M16,28 L17.5,52 Q17.5,54 20,54 L40,54 Q42.5,54 42.5,52 L44,28 Z" fill="#c8956c"/>
    <!-- 손잡이 -->
    <path d="M44,32 Q52,32 52,40 Q52,48 44,48" fill="none" stroke="#fdf0e0" stroke-width="5" stroke-linecap="round"/>
    <!-- 컵 상단 -->
    <rect x="14" y="20" width="32" height="6" rx="3" fill="#e8d5c0"/>
    <!-- 하트 -->
    <path d="M26,40 C26,37.5 30,37.5 30,40 C30,42.5 28,45 28,45 C28,45 26,42.5 26,40Z" fill="#f5a0b8" opacity="0.9"/>
    <!-- 라벨 -->
    <rect x="19" y="32" width="22" height="12" rx="3" fill="rgba(255,255,255,0.35)"/>
    <text x="30" y="40" text-anchor="middle" font-size="5.5" fill="#8b6550" font-family="sans-serif" font-weight="700">coffee</text>
  </g>
</svg>
